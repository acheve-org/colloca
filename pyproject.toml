[project]
name = "colloca"
version = "0.1.0"
description = "Self-hosted corpus builder and explorer for translators (Spanish, Italian)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "spacy>=3.7,<3.9",
]

[dependency-groups]
# spaCy models are not on PyPI (spaCy releases). The Docker image does not bundle them: they are
# mounted from the models volume. Locally, the small ones are installed for dev and tests.
dev = [
    "pytest>=8",
    "es-core-news-sm",
    "it-core-news-sm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colloca"]

[tool.uv.sources]
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
it-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
