[project]
name = "colloca"
version = "0.1.0"
description = "Self-hosted corpus builder and explorer for translators (Spanish, Italian)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "spacy>=3.7,<3.9",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    "striprtf>=0.0.35",
]

[project.scripts]
colloca-import-reference = "colloca.cli:main"

[project.optional-dependencies]
ocr = [
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
]

[dependency-groups]
# spaCy models are not on PyPI (spaCy releases). The Docker image does not bundle them: they are
# mounted from the models volume. Locally, the small ones are installed for dev and tests.
dev = [
    "pytest>=8",
    "es-core-news-sm",
    "it-core-news-sm",
    "ruff>=0.17.6",
    "lxml>=5",     # RELAX NG validation of the TBX export (tests/test_tbx_schema.py)
    "mypy>=2.4.1",
    "pytest-cov>=7.1.0",
    "pypdfium2>=5.15.2",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colloca"]
# The UI build (`mise run ui:build`) is git-ignored, which hatch would otherwise leave out.
# Build the frontend before `uv build`; without it the package serves a "UI not built" page.
artifacts = ["src/colloca/static/**"]

[tool.hatch.build.targets.sdist]
# uv build makes the wheel from the sdist, so the sdist must carry the built UI too.
artifacts = ["src/colloca/static/**"]

[tool.uv.sources]
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
it-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Depends"]   # FastAPI declares parameters this way

[tool.mypy]
# Basic level: checks annotated code, ignores third-party packages without stubs.
python_version = "3.12"
mypy_path = "src"
packages = ["colloca"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/colloca"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
