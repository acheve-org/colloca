services:
  corpora:
    build: .
    image: corpora:local
    ports:
      - "127.0.0.1:8000:8000"   # local only; change deliberately to expose on a network
    volumes:
      - corpora-data:/data      # SQLite database lives here
      # spaCy models and OCR data, installed from the Languages screen. HOME is unset in Windows shells,
      # so fall back to USERPROFILE there.
      - ${HOME:-${USERPROFILE}}/.spacy:/models
    environment:
      SPACY_SIZE: lg            # sm | md | lg
      # ALLOW_PRIVATE_URLS: "1" # allow fetching intranet URLs (off by default)
      MAX_DOWNLOAD_MB: "15"
      # CORPORA_PASSWORD: "change me"  # ask for a password (see the README: Password and encryption)
    restart: unless-stopped

volumes:
  corpora-data:
